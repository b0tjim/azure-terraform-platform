name: Plan

# Runs `terraform plan` against Azure using OIDC (no stored secrets).
# Skips cleanly unless the repo variables AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID and TFSTATE_STORAGE_ACCOUNT are set (see README).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # request the OIDC token for azure/login
  contents: read

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    # No Azure vars -> job is skipped. Fork PRs never get OIDC tokens, so skip them too.
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      vars.AZURE_TENANT_ID != '' &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.TFSTATE_STORAGE_ACCOUNT != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP || 'rg-bakery-tfstate' }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bakery-${ENVIRONMENT}.tfstate"
      - name: terraform plan
        run: terraform plan -input=false -var-file="envs/${ENVIRONMENT}.tfvars" -out=tfplan
